<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدّي الدقيقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hero:#d3232f; --page:#f4f4f5; --card:#ffffff; --text:#1f2125; --muted:#6b7078;
  --line:#e7e8eb; --tile:#f1f2f4; --accent:#d3232f; --ok:#1f9d6b; --shadow:0 4px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Kufi Arabic',system-ui,sans-serif;color:var(--text);background:var(--hero);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;background:var(--hero)}
.screen{display:none;flex:1;flex-direction:column;animation:fade .28s ease}
.screen.active{display:flex}
#store,#badgesPage{touch-action:pan-y}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== الجزء العلوي (الهيرو) ===== */
.hero{color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 26px}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mark{width:38px;height:38px}
.greet{font-size:14px;opacity:.9}
.hero h1{margin:0;font-size:30px;font-weight:800;line-height:1.3}
.hero p{margin:4px 0 0;font-size:14px;opacity:.88}

/* ===== اللوحة السفلية ===== */
.sheet{flex:1;background:var(--page);border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--accent);line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.label{font-weight:800;margin:0 2px 10px;font-size:16px}

/* بطاقات الفئات بنمط التطبيق */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:0 0 0 14px;border:2px solid transparent;background:var(--card);border-radius:18px;box-shadow:var(--shadow);color:var(--text);font:inherit;text-align:right;cursor:pointer;overflow:hidden;transition:.15s}
.cat .ic{flex:none;width:64px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--tile)}
.cat .nm{flex:1;font-weight:800;font-size:17px}
.cat:after{content:"‹";font-size:28px;color:var(--muted);line-height:1}
.cat .chk{display:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;align-items:center;justify-content:center}
.cat.sel{border-color:var(--accent)}
.cat.sel .chk{display:flex}
.cat.sel:after{display:none}

.btn{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:19px;color:#fff;background:var(--accent);box-shadow:0 8px 18px rgba(211,35,47,.3);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow);margin-top:10px;font-size:17px}
.note{margin-top:14px;text-align:center;color:var(--muted);font-size:12.5px}

/* ===== البحث عن خصم (خلفية الهوية كاملة) ===== */
.full{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:#fff;padding:24px}
.radar{width:120px;height:120px;border-radius:50%;border:3px solid #fff;position:relative;margin:0 auto 18px;animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 36px rgba(255,255,255,0)}}
.big{font-size:26px;font-weight:800}
.sub{opacity:.85;font-size:15px}
.vs{display:flex;align-items:center;justify-content:center;gap:16px}
.av{width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 6px}
.pname{font-weight:800}
.tag{font-size:11px;opacity:.85}

/* ===== اللعب ===== */
.top{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;gap:8px;margin-bottom:12px}
.pl{background:rgba(255,255,255,.16);border-radius:16px;padding:8px 10px;text-align:center;color:#fff}
.pl .n{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:30px;font-weight:800;line-height:1.15}
.pl .s.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.35)}}
.clock{position:relative;width:84px;height:84px}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .bg{stroke:rgba(255,255,255,.25)}
.clock .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s}
.clock .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}
.clock.low .fg{stroke:#ffd24a} .clock.low .num{color:#ffd24a;animation:blink .5s infinite alternate}
@keyframes blink{to{transform:scale(1.14)}}
.race{display:flex;height:38px;border-radius:19px;overflow:hidden;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.race i{display:flex;align-items:center;height:100%;transition:width .45s ease;font-style:normal;font-size:14px;font-weight:800;padding:0 14px;gap:8px;white-space:nowrap;overflow:hidden;min-width:0}
.race .m{background:#fff;color:var(--hero);width:50%;justify-content:flex-start} .race .b{background:rgba(70,0,10,.55);color:#fff;width:50%;justify-content:flex-end}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.chip{background:var(--card);border-radius:20px;padding:3px 12px;font-weight:700;box-shadow:var(--shadow)}
.combo{color:var(--accent);font-weight:800;opacity:0;transition:.2s}
.combo.on{opacity:1}
.qcard{background:var(--card);border-radius:20px;border-right:5px solid var(--accent);padding:22px 16px;font-size:21px;font-weight:800;line-height:1.7;text-align:center;min-height:112px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.qcard.in{animation:qin .25s}
@keyframes qin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

/* ===== صفوف الإجابات ===== */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 0 0 12px;border:2px solid transparent;background:var(--card);color:var(--text);border-radius:16px;box-shadow:var(--shadow);font:inherit;font-size:17px;font-weight:700;text-align:right;cursor:pointer;overflow:hidden;transition:transform .12s,background .15s,border-color .15s}
.opt:active{transform:scale(.985)}
.opt .lt{flex:none;width:54px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:var(--tile);color:var(--accent)}
.opt .tx{flex:1;padding:8px 0}
.opt .st{flex:none;width:28px;height:28px;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.ok .st{display:flex;background:var(--ok)}
.opt.bad{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));animation:shake .35s}
.opt.bad .lt{background:var(--accent);color:#fff}
.opt.bad .st{display:flex;background:var(--accent)}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.opts.lock .opt{pointer-events:none}

/* ===== النتيجة ===== */
.hero.res{text-align:center;padding-bottom:30px}
.res-emoji{font-size:76px;line-height:1.1;animation:bounce .8s}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.res-title{margin:6px 0 0;font-size:34px;font-weight:800}
.res-scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.score-card{background:var(--card);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.score-card .n{font-size:13px;color:var(--muted)}
.score-card .s{font-size:44px;font-weight:800;line-height:1.2}
.score-card.me .s{color:var(--ok)} .score-card.bot .s{color:var(--accent)}
.res-extra{color:var(--muted);font-size:15px;font-weight:700;text-align:center;margin:4px 0 8px}
.sp{flex:1}

/* ===== تحسينات: ترويسة مضغوطة + شارات + هوية ===== */
.hero{position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero:before{width:170px;height:170px;top:-80px;left:-40px}
.hero:after{width:110px;height:110px;bottom:-60px;right:30px}
.hero>*{position:relative;z-index:1}
.hero>.wm{position:absolute!important;left:-18px;bottom:-30px;width:150px;height:150px;opacity:.13;z-index:0;pointer-events:none;transform:rotate(-8deg)}
.hero.compact{padding:calc(10px + env(safe-area-inset-top)) 18px 16px}
.hero-row{display:flex;align-items:center;gap:12px}
.hero-row .mark{width:40px;height:40px;flex:none;background:rgba(255,255,255,.16);border-radius:14px;padding:7px}
.ttl{flex:1}
.ttl h1{font-size:23px;line-height:1.2}
.ttl .greet{font-size:12.5px;opacity:.85}
.bcount{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 11px;font-weight:800;font-size:14px}
.sheet{border-radius:24px 24px 0 0;padding-top:16px}
.stats{margin-bottom:14px}
.stat b{font-size:22px}
.label{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.label small{color:var(--muted);font-weight:500;font-size:13px}
.label:before{content:"";width:5px;height:16px;border-radius:3px;background:var(--accent)}
.cat{min-height:56px}
.cat .ic{width:60px;color:var(--accent)}
.cat .ic svg{width:26px;height:26px}
.btn{margin-top:14px}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.bd{flex:none;width:72px;text-align:center;border:0;background:none;font:inherit;color:var(--text);cursor:pointer;padding:0}
.bd .bi{width:56px;height:56px;margin:0 auto 5px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tile);color:#b3b7bf;border:2px dashed var(--line)}
.bd .bi svg{width:26px;height:26px}
.bd.on .bi{background:linear-gradient(160deg,#e8414d,var(--accent));color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--accent),0 6px 12px rgba(211,35,47,.3)}
.bd .bn{font-size:11.5px;font-weight:700;line-height:1.25;color:var(--muted)}
.bd.on .bn{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1f2125;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* لعب */
#game .hero.tight{padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.top{grid-template-columns:1fr 72px 1fr;margin-bottom:9px}
.pl{padding:5px 8px}
.pl .s{font-size:26px}
.clock{width:72px;height:72px}
.clock .num{font-size:26px}
#game .sheet{padding-top:14px}
.meta{margin-bottom:8px}
.qcard{min-height:100px;font-size:20px;padding:18px 14px}
.opts{margin-top:12px;gap:9px}
.opt{min-height:54px}
/* نتيجة */
.hero.res{padding:calc(10px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;justify-content:center;gap:12px}
.res-emoji{font-size:48px}
.res-title{font-size:28px;margin:0}
.nb{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:8px;border:2px solid var(--accent);animation:nbin .5s both}
.nb .bi{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e8414d,var(--accent));color:#fff}
.nb .bi svg{width:24px;height:24px}
.nb small{color:var(--accent);font-weight:800;font-size:12px;display:block}
.nb b{font-size:16px}
.nb span{display:block;color:var(--muted);font-size:12.5px}
@keyframes nbin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ===== أيقونات داخل مربعات مدوّرة بدل الشريط الجانبي، وإزالة الأسهم ===== */
.cat{padding:8px 12px 8px 14px;gap:12px}
.cat:after{display:none}
.cat .ic{width:46px;height:46px;align-self:center;border-radius:14px;margin:0}
.cat .ic svg{width:25px;height:25px}
.cat .chk{display:none}
.cat.sel .chk{display:flex}
.opt{padding:8px 12px 8px 14px}
.opt .lt{width:38px;height:38px;align-self:center;border-radius:12px;font-size:18px}
.opt .tx{padding:0}
.mixinfo{text-align:center;color:var(--muted);font-size:14px;font-weight:700;margin-top:10px}
#goBtn{padding:20px;font-size:23px;margin-top:10px;border-radius:18px}
#home .sheet{min-height:0}
.sndbtn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.qbar{height:5px;border-radius:5px;background:var(--line);margin-top:10px;overflow:hidden}
.qbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.chip[data-l="1"]{color:var(--ok)}
.chip[data-l="3"]{color:var(--accent)}
.expl{display:none;margin-top:10px;background:color-mix(in srgb,var(--accent) 9%,var(--card));border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:700;line-height:1.6}
.expl.on{display:block;animation:fade .25s}
.sponsor{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);border:2px dashed var(--line);margin-top:2px}
.sponsor .gi{width:46px;height:46px;border-radius:14px;background:var(--tile);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.sponsor small{color:var(--accent);font-weight:800;font-size:12px;display:block}
.sponsor b{font-size:16px}
.sponsor span{display:block;color:var(--muted);font-size:12.5px}
.opts{margin-top:10px}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--accent),#a81a24);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:0 8px 18px rgba(211,35,47,.28)}
.wallet small{display:block;opacity:.9;font-size:13px}
.wallet b{font-size:32px;font-weight:800;line-height:1.2}
.wbtn{border:0;background:#fff;color:var(--accent);font:inherit;font-weight:800;font-size:15px;border-radius:14px;padding:10px 14px;cursor:pointer}
.earned{text-align:center;font-size:24px;font-weight:800;color:var(--ok);margin:2px 0 10px}
.earned small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.rw{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:10px}
.rw .gi{width:46px;height:46px;border-radius:14px;background:var(--tile);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.rw .rb{flex:1;min-width:0}
.rw .rb b{display:block;font-size:15.5px}
.rw .rb span{color:var(--muted);font-size:12.5px}
.pbar{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.rbtn{flex:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:13px;border-radius:12px;padding:9px 12px;cursor:pointer}
.rbtn:disabled{background:var(--tile);color:var(--muted);cursor:default}
.hist{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.hist b{display:block;font-size:14.5px}
.hist span{color:var(--muted);font-size:12px}
.hist code{background:var(--tile);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:800;letter-spacing:1px}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:22px;padding:20px 18px;width:100%;max-width:360px;text-align:center}
.mbox h3{margin:0 0 8px;font-size:20px}
.mbox #mBody{color:var(--muted);font-size:15px;line-height:1.7}
.mbox code{display:inline-block;background:var(--tile);color:var(--text);border-radius:8px;padding:4px 10px;font-weight:800;letter-spacing:1.5px;margin:4px 0}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns .btn{margin-top:0;padding:12px;font-size:16px;flex:1}
.radar:after{content:none}
.radar{display:flex;align-items:center;justify-content:center}
.av{color:#fff;font-size:36px;font-weight:800}
.av svg{display:block}
.vsb{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--hero);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tag{display:flex;align-items:center;justify-content:center;gap:4px}
.combo{display:inline-flex;align-items:center;gap:3px}
.res-emoji{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:0;animation:bounce .8s}
.opt .st svg{stroke-width:3.2}
.expl.on{display:flex;gap:8px;align-items:flex-start}
.expl svg{flex:none;color:var(--accent);margin-top:2px}
/* خط نوتو كوفي أعرض: ضبط الأحجام */
body{font-family:'Noto Kufi Arabic',system-ui,sans-serif}
.ttl h1{font-size:20px}
.qcard{font-size:18px;line-height:1.9}
.opt{font-size:15.5px}
.cat .nm{font-size:15.5px}
.btn{font-size:17px}
#goBtn{font-size:20px}
.wallet b{font-size:28px}
.stat b{font-size:20px}
.pl .s{font-size:24px}
.res-title{font-size:25px}
.expl{font-size:13.5px}
.bd .bn{font-size:10.5px}
.rw .rb b{font-size:14px}
.exclusive{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-top:2px}
.exclusive .gi{width:46px;height:46px;border-radius:14px;background:var(--tile);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.exclusive b{font-size:14.5px;line-height:1.6}
.nameIn{width:100%;border:2px solid var(--line);background:var(--page);color:var(--text);border-radius:14px;padding:12px;font:inherit;font-size:16px;text-align:center;outline:none}
.nameIn:focus{border-color:var(--accent)}
.gpick{display:flex;gap:10px;margin-top:12px}.gpick button{flex:1;border:2px solid var(--line);background:var(--page);color:var(--text);border-radius:14px;padding:11px;font:inherit;font-weight:800;font-size:15px}.gpick button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.shareimg{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;display:block;margin:0 auto}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.mbox{max-height:92vh;overflow:auto}
.mbtns{flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;overflow:visible;padding:0;margin:0 0 12px}
.bd{width:auto}
.bd .bi{width:48px;height:48px;margin:0 auto 4px}
.bd .bn{font-size:11px;white-space:nowrap}
button.bcount{border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:6px 10px;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .12s,background .12s}
button.bcount:active,.sndbtn:active{transform:scale(.93);background:rgba(255,255,255,.38)}
.sndbtn{border:1.5px solid rgba(255,255,255,.6)!important;background:rgba(255,255,255,.22)!important;box-shadow:0 2px 6px rgba(0,0,0,.15);width:38px!important;height:38px!important;transition:transform .12s,background .12s}
.bcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.bcard .bi{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tile);color:#b3b7bf;border:2px dashed var(--line)}
.bcard.on .bi{background:linear-gradient(160deg,#e8414d,var(--accent));color:#fff;border:2px solid #fff;box-shadow:0 0 0 2px var(--accent),0 6px 12px rgba(211,35,47,.25)}
.bcard .bt{flex:1;min-width:0}
.bcard .bt b{display:block;font-size:15px}
.bcard .bt span{display:block;color:var(--muted);font-size:12.5px;line-height:1.6}
.bcard .bs{flex:none;color:var(--muted)}
.bcard.on .bs{color:var(--ok)}
.bcard .prog{font-size:11.5px;color:var(--muted);margin-top:4px}
.ttl{min-width:0}
.ttl .greet{display:block;font-size:13.5px;opacity:1;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;padding:6px 0}
.bt2{border:0;background:none;font:inherit;color:var(--text);text-align:center;cursor:pointer;padding:0}
.ring{--p:0;width:74px;height:74px;margin:0 auto 6px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.ring .bi{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:#b3b7bf}
.bt2.on .ring .bi{background:linear-gradient(160deg,#e8414d,var(--accent));color:#fff}
.bt2 .nm{font-size:11.5px;font-weight:700;color:var(--muted)}
.bt2.on .nm{color:var(--text)}

.vs{align-items:flex-start!important;gap:6px!important;width:100%}
.vs .pcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.vs .pcol .av{margin:0 0 10px}
.vs .pname{width:100%;font-size:16px;line-height:1.4;min-height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .tag{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;opacity:.9;margin-top:4px;min-height:18px;white-space:nowrap}
.vs .vsb{flex:none;margin-top:28px}

.race i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.race i b{font-size:18px;font-weight:800;flex:none;line-height:1}
.race .m{box-shadow:-2px 0 6px rgba(0,0,0,.12)}

/* الاكتفاء بشريط المقارنة: إخفاء بطاقتي النقاط */
#game .top .pl{display:none}
#game .top{display:flex;justify-content:center}
#game .race{margin-top:12px}

/* مؤقّت السؤال: إطار متناقص حول البطاقة */
.qwrap{position:relative}
.qwrap .qcard{border-right:0}
.qring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.qring path{stroke:#1f9d6b;stroke-dasharray:100 100;transition:stroke .25s}
.qsec{position:absolute;top:9px;left:14px;font-size:13px;font-weight:800;color:#1f9d6b;transition:color .25s;pointer-events:none}
.qwrap.warn .qring path{stroke:#f08a00}.qwrap.warn .qsec{color:#f08a00}
.qwrap.danger .qring path{stroke:#d3232f}.qwrap.danger .qsec{color:#d3232f;animation:qpulse .5s ease-in-out infinite alternate}
@keyframes qpulse{to{transform:scale(1.18)}}
.qbar{display:none}

/* المنافس: رمادي بلون بطاقات التطبيق */
.race .b{background:#2b2c2e!important;color:#fff}
.race{background:#2b2c2e!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)!important}
/* عداد الجولة: قرص رمادي داكن وحلقة أوضح */
.clock{filter:drop-shadow(0 3px 8px rgba(60,0,8,.35))}
.clock::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#2b2c2e}
.clock .bg{stroke:rgba(255,255,255,.22)}
.clock .fg{stroke:#fff}
.clock .num{flex-direction:column;line-height:1;font-size:28px}
.clock .num::after{content:"ثانية";font-size:10px;font-weight:700;opacity:.75;margin-top:3px}
.clock.low::before{background:#4a1016}
.clock.low .fg{stroke:#ffd24a}
/* لا يتداخل رقم ثواني السؤال مع نصه */
.qwrap .qcard{padding-top:34px}
.qsec{top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.05);border-radius:10px;padding:1px 10px}
.qwrap.danger .qsec{animation:none}

/* عداد الجولة: رقم كبير يتغير لونه (الخيار ٢) */
.clock{width:auto!important;height:auto!important;filter:none}
.clock svg,.clock::before{display:none!important}
.clock .num{position:static!important;inset:auto;font-size:60px!important;font-weight:800;line-height:1;transition:color .3s;flex-direction:column;text-shadow:0 2px 8px rgba(60,0,8,.3)}
.clock .num::after{font-size:12px!important;opacity:.85;margin-top:4px}
.clock.mid .num{color:#ffd24a}
.clock.low .num{color:#ffd24a;animation:qpulse2 .5s ease-in-out infinite alternate}
@keyframes qpulse2{to{transform:scale(1.12)}}

/* الوضع الداكن */
html[data-theme="dark"]{--hero:#202124;--page:#111312;--card:#2a2b2e;--text:#f3f3f4;--muted:#9da1a8;--line:#34353a;--tile:#2a2b2e;--accent:#e0262f;--shadow:none}
html[data-theme="dark"] .race .m,html[data-theme="dark"] .vsb{color:var(--accent)}
html[data-theme="dark"] .hero:before,html[data-theme="dark"] .hero:after{display:none}
html[data-theme="dark"] .sheet{background:var(--page)}
html[data-theme="dark"] #demoTop{background:var(--card)!important;color:#ff6b75!important;border-color:#ff6b75!important}
html[data-theme="dark"] .toast{background:#f3f3f4;color:#1f2125}
html[data-theme="dark"] .opt,html[data-theme="dark"] .qcard,html[data-theme="dark"] .modal-card,html[data-theme="dark"] .stat{color:var(--text)}
html[data-theme="dark"] .qsec{background:rgba(255,255,255,.08)}

/* ازدحام الترويسة */
#home .hero-row{gap:8px}
#home .hero h1{font-size:22px;white-space:nowrap}
#home .greet{font-size:12px;white-space:nowrap}
#home .ttl{min-width:0;flex:1}
#home .hero-row .sndbtn{width:36px!important;height:36px!important}
button.bcount{padding:6px 9px}

/* ثواني السؤال فوق البطاقة */
.qwrap .qcard{padding-top:22px!important}
.meta .qsec{position:static!important;transform:none!important;margin:0 auto;background:rgba(31,157,107,.12);color:#1f9d6b;border-radius:12px;padding:3px 12px;font-size:14px;font-weight:800;pointer-events:none}
.meta .qsec.warn{background:rgba(240,138,0,.14);color:#f08a00}
.meta .qsec.danger{background:rgba(211,35,47,.12);color:#d3232f;animation:qpulse .5s ease-in-out infinite alternate!important}

/* ترويسة الرئيسية: لا تداخل بين العنوان والأزرار */
#home .hero-row{gap:6px}
#home .hero-row .mark{width:34px;height:34px;padding:6px;border-radius:12px}
#home .hero h1{font-size:20px}
#home .hero-row .sndbtn{width:34px!important;height:34px!important}
#home button.bcount{padding:5px 8px;gap:4px;font-size:12.5px}
#home button.bcount svg:last-child{display:none}
#home .ttl{overflow:hidden}
</style>

let AC = null, SIL = null;
function silentWav(){
  const n=800, b=new Uint8Array(44+n), dv=new DataView(b.buffer);
  const w=(o,t)=>{ for(let i=0;i<t.length;i++) b[o+i]=t.charCodeAt(i); };
  w(0,'RIFF'); dv.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,8000,true); dv.setUint32(28,8000,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true); w(36,'data'); dv.setUint32(40,n,true);
  for(let i=0;i<n;i++) b[44+i]=128;
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function audio(){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
  /* يجعل الصوت يعمل حتى لو كان الجوال على الوضع الصامت */
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{
    if(!SIL){ SIL = new Audio(silentWav()); SIL.loop=true; SIL.volume=.01; }
    if(stats.sound){ const p=SIL.play(); if(p&&p.catch) p.catch(()=>{}); } else SIL.pause();
  }catch(e){}
  return AC;
}
function tone(f,t0,d,type,vol,slide){
  if(!stats.sound) return; const a = audio(); if(!a) return;
  try{
    const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}

function pick(){

  const order = [1,2,3].sort((a,b)=>Math.abs(a-G.level)-Math.abs(b-G.level));
  let cand = [];
  for(const l of order){ cand = pool.filter(x=>x.lvl===l); if(cand.length) break; }
  const diff = cand.filter(x=>!G.cur || x.cat!==G.cur.cat);
  if(diff.length) cand = diff;

  G.used.add(it); return it;

  const mark=()=>{ $('gM').classList.toggle('on',g==='m'); $('gF').classList.toggle('on',g==='f'); };
  $('gM').onclick=()=>{g='m';mark();}; $('gF').onclick=()=>{g='f';mark();}; mark();
}
async function openShare(){
  if(!lastRes) return;
  if(!stats.playerName){ askName(openShare); return; }
  const name=stats.playerName;
  shareText='حصلت على '+lastRes.me+' نقطة في «تحدّي الدقيقة»! هل تستطيع التغلب عليّ؟ — '+name;
  const c = await drawCard(lastRes,name);
  const url = c.toDataURL('image/png');
  shareFile = null;
  c.toBlob(b=>{ try{ if(b) shareFile = new File([b],'tahaddi-alduqaiqa.png',{type:'image/png'}); }catch(e){} },'image/png');
  showModal('شارك بطاقتك','<img class="shareimg" src="'+url+'" alt="بطاقة النتيجة"><div class="hint">إن لم تظهر نافذة المشاركة، اضغط مطولاً على البطاقة لحفظها.</div>',
    [{t:'مشاركة',full:true,f:doShare},{t:'تغيير الاسم',ghost:true,f:()=>askName(openShare)},{t:'إغلاق',ghost:true,f:closeModal}]);
}
function onShared(){ stats.shared=(stats.shared||0)+1; save(stats); setTimeout(badgeEvent,1600); }
async function doShare(){
  try{
    if(navigator.canShare && shareFile && navigator.canShare({files:[shareFile]})){ await navigator.share({files:[shareFile],text:shareText,title:'تحدّي الدقيقة'}); onShared(); return; }
    if(navigator.share){ await navigator.share({text:shareText,title:'تحدّي الدقيقة'}); onShared(); return; }
    throw new Error('no-share');
  }catch(e){
    if(e && e.name==='AbortError') return;
    try{ await navigator.clipboard.writeText(shareText); toast('تم نسخ النص، الصقه في أي تطبيق'); onShared(); }catch(_){ toast(shareText); }
  }
}
$('shareBtn').onclick = openShare;


/* ===== متجر النقاط ===== */
function showModal(title, body, btns){
  $('mTitle').textContent=title; $('mBody').innerHTML=body;
  const bx=$('mBtns'); bx.innerHTML='';
  btns.forEach(b=>{ const e=document.createElement('button'); e.className='btn'+(b.ghost?' ghost':''); e.style.flex=b.full?'1 1 100%':'1 1 40%'; e.textContent=b.t; e.onclick=b.f; bx.appendChild(e); });
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
function openStore(){ renderStore(); show('store'); }
document.getElementById('demoTop').onclick=function(){ stats.balance+=5000; stats.totalPoints+=5000; save(stats); renderStore(); renderStats(); };
/* الرجوع بالسحب: الصفحة تتبع الإصبع والخلفية (الرئيسية) ثابتة */
['store','badgesPage'].forEach(function(id){
  var el=document.getElementById(id), home=document.getElementById('home'); if(!el||!home) return;
  var sx=0,sy=0,t0=0,drag=false,lock=false,W=360;
  function reset(){ el.style.transition=''; el.style.transform=''; el.style.boxShadow=''; el.style.position=''; el.style.zIndex=''; el.style.animation=''; home.style.position=''; home.style.inset=''; home.style.zIndex=''; home.style.display=''; home.style.width=''; home.style.maxWidth=''; home.style.margin=''; }
  el.addEventListener('touchstart',function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; t0=Date.now(); drag=false; lock=false; W=el.offsetWidth||360; },{passive:true});
  el.addEventListener('touchmove',function(e){
    var t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(!lock){
      if(Math.abs(dy)>12 && Math.abs(dy)>Math.abs(dx)){ lock=true; drag=false; return; }
      if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.2){
        drag=true; lock=true;
        el.style.animation='none'; el.style.position='relative'; el.style.zIndex='2'; el.style.boxShadow='-6px 0 24px rgba(0,0,0,.18)'; el.style.background='var(--page)';
        home.style.display='flex'; home.style.position='fixed'; home.style.top='0'; home.style.bottom='0'; home.style.left='50%'; home.style.width='100%'; home.style.maxWidth='480px'; home.style.transform='translateX(-50%)'; home.style.zIndex='1'; home.style.animation='none';
      } else return;
    }
    if(drag){ if(e.cancelable) e.preventDefault(); el.style.transition='none'; el.style.transform='translateX('+dx+'px)'; }
  },{passive:false});
  function end(e){
    if(!drag) return; drag=false;
    var t=e.changedTouches[0], rdx=t.clientX-sx, sg=rdx<0?-1:1, dx=Math.abs(rdx), v=dx/Math.max(1,Date.now()-t0);
    el.style.transition='transform .22s ease';
    function clean(){ el.style.background=''; home.style.transform=''; home.style.top=''; home.style.bottom=''; home.style.left=''; home.style.animation=''; reset(); }
    if(dx>W*0.35 || v>0.6){
      el.style.transform='translateX('+(sg*W)+'px)';
      setTimeout(function(){ var b=document.getElementById(id==='store'?'backBtn':'backBtn2'); if(b) b.click(); clean(); },210);
    } else {
      el.style.transform='translateX(0)';
      setTimeout(clean,230);
    }
  }
  el.addEventListener('touchend',end,{passive:true});
  el.addEventListener('touchcancel',end,{passive:true});
});
function renderStore(){
  $('sBal').textContent = fmt(stats.balance);
  const groups=[['cash','مكافآت نقدية'],['gift','قسائم وهدايا'],['miles','أميال']];
  const box=$('rewards'); box.innerHTML='';
  groups.forEach(([ty,label])=>{
    const items=REWARDS.filter(r=>r.type===ty); if(!items.length) return;
    const h=document.createElement('div'); h.className='label'; h.textContent=label; box.appendChild(h);
    items.forEach(r=>{
      const can=stats.balance>=r.cost, pct=Math.min(100,Math.round(stats.balance/r.cost*100));
      const c=document.createElement('div'); c.className='rw';
      c.innerHTML='<div class="gi">'+svg(r.icon,24)+'</div><div class="rb"><b>'+r.title+'</b><span>'+fmt(r.cost)+' نقطة</span><div class="pbar"><i style="width:'+pct+'%"></i></div></div><button class="rbtn"'+(can?'':' disabled')+'>'+(can?'استبدال':'ينقصك '+fmt(r.cost-stats.balance))+'</button>';
      c.querySelector('.rbtn').onclick=()=>confirmRedeem(r);
      box.appendChild(c);
    });
  });
  const hs=$('history'); hs.innerHTML='';
  if(!stats.redeemed.length){ hs.innerHTML='<div class="empty">لا توجد طلبات بعد</div>'; }
  else stats.redeemed.slice(0,10).forEach(h=>{ const d=document.createElement('div'); d.className='hist'; d.innerHTML='<div><b>'+h.title+'</b><span>'+h.date+'</span></div><code>'+h.code+'</code>'; hs.appendChild(d); });
}
function confirmRedeem(r){
  showModal('تأكيد الاستبدال','سيُخصم '+fmt(r.cost)+' نقطة مقابل «'+r.title+'».',
    [{t:'تأكيد',f:()=>doRedeem(r)},{t:'إلغاء',ghost:true,f:closeModal}]);
}
function doRedeem(r){
  if(stats.balance<r.cost){ closeModal(); return; }
  stats.balance -= r.cost;
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code='';
  for(let i=0;i<8;i++) code+=A[Math.floor(Math.random()*A.length)];
  stats.redeemed.unshift({title:r.title, code:code, date:new Date().toLocaleDateString('ar-KW')});
  save(stats); renderStats(); renderStore();
  SND.badge();
  showModal('تم تسجيل طلبك','رمز الطلب:<br><code>'+code+'</code><br>هذا طلب تجريبي، ويُنفَّذ الاستبدال الفعلي عبر نظام البنك.',[{t:'حسناً',f:closeModal}]);
  badgeEvent();
}
$('storeBtn').onclick = openStore;
$('badgesBtn').onclick = ()=>{ renderBadges(); show('badgesPage'); };
$('backBtn2').onclick = ()=>{ renderStats(); show('home'); };
$('backBtn').onclick = ()=>{ renderStats(); show('home'); };
$('modal').onclick = e=>{ if(e.target.id==='modal') closeModal(); };

function renderGreet(){ $('greet').textContent = 'أهلاً، ' + (stats.playerName || 'عبدالله العنزي'); }
$('greet').onclick = ()=>askName(()=>{ closeModal(); renderGreet(); });
renderGreet();
$('meAv').innerHTML = svg('user',44);
applyTheme(); renderSound(); renderStats();
loadRemoteQuestions().then(acceptInviteFromUrl);
</script>
